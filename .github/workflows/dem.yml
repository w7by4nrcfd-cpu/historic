name: بناء بلاطات التضاريس
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/build_dem.py, .github/workflows/dem.yml]
permissions:
  contents: write
jobs:
  dem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow
      - run: python3 tools/build_dem.py /tmp/dem
      - name: نشر البلاطات في فرع dem-data
        run: |
          cd /tmp/dem
          git init -q -b dem-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Terrain Tiles (terrarium) لمنطقة الأطلس، مكممة إلى 8 أمتار"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dem-data
